{{define "page"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap">
<link rel="stylesheet" href="/_mdserve/style.css">
</head>
<body class="{{.Kind}}">
<header>
<nav>{{range $i, $c := .Crumbs}}{{if $i}} / {{end}}{{if $c.Href}}<a href="{{$c.Href}}">{{$c.Label}}</a>{{else}}{{$c.Label}}{{end}}{{end}}</nav>
{{if not .Stopped}}<span>{{if .Raw}}<a href="?raw">raw</a> {{end}}<form method="post" action="/_mdserve/stop">{{if .Tree}}<input type="hidden" name="tree" value="{{.Tree}}"><button>Stop serving</button>{{else}}<button>Stop server</button>{{end}}</form></span>{{end}}
</header>
<main>
{{.Body}}
</main>
</body>
</html>
{{end}}
